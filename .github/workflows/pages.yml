name: Deploy Pages

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    deploy:
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - uses: actions/checkout@v7

            # The committed single-file build is the app; Pages expects it as index.html
            - name: Stage site
              run: |
                  mkdir site
                  cp StrongPro.html site/index.html
                  cp -r public/. site/

            - uses: actions/upload-pages-artifact@v4
              with:
                  path: site

            - id: deployment
              uses: actions/deploy-pages@v4
